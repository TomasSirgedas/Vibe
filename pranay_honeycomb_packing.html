, 1.414213562373095]], [[3.5355339059327373, 4.242640687119285, 2.1213203435596424], [4.242640687119285, 4.949747468305832, 2.1213203435596424], [4.242640687119285, 4.242640687119285, 1.414213562373095]], [[4.242640687119285, 3.5355339059327373, 2.1213203435596424], [3.5355339059327373, 4.242640687119285, 2.1213203435596424], [4.242640687119285, 4.242640687119285, 1.414213562373095]], [[4.949747468305832, 4.242640687119285, 2.1213203435596424], [4.242640687119285, 3.5355339059327373, 2.1213203435596424], [4.242640687119285, 4.242640687119285, 1.414213562373095]], [[4.949747468305832, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.949747468305832, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 4.242640687119285]], [[4.242640687119285, 4.949747468305832, 3.5355339059327373], [3.5355339059327373, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 4.242640687119285]], [[3.5355339059327373, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 3.5355339059327373, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 4.242640687119285]], [[4.242640687119285, 3.5355339059327373, 3.5355339059327373], [4.949747468305832, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 4.242640687119285]], [[4.242640687119285, 4.949747468305832, 3.5355339059327373], [4.949747468305832, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 2.82842712474619]], [[3.5355339059327373, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.949747468305832, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 2.82842712474619]], [[4.242640687119285, 3.5355339059327373, 3.5355339059327373], [3.5355339059327373, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 2.82842712474619]], [[4.949747468305832, 4.242640687119285, 3.5355339059327373], [4.242640687119285, 3.5355339059327373, 3.5355339059327373], [4.242640687119285, 4.242640687119285, 2.82842712474619]]];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const showTets = document.getElementById('showTets');
const showOcts = document.getElementById('showOcts');
const xrayTets = document.getElementById('xrayTets');

let rx = 0.55, ry = -0.65, zoom = 85, dragging = false, lx = 0, ly = 0;

// Normalized directional light (upper-left-front)
const L = [-0.48, -0.64, -0.60];

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; draw(); }
window.onresize = resize;
[showTets, showOcts, xrayTets].forEach(el => el.onchange = draw);

canvas.onmousedown = e => { dragging = true; lx = e.clientX; ly = e.clientY; };
window.onmouseup = () => dragging = false;
window.onmousemove = e => {
  if (!dragging) return;
  ry += (e.clientX - lx) * 0.008;
  rx += (e.clientY - ly) * 0.008;
  lx = e.clientX; ly = e.clientY;
  draw();
};
canvas.onwheel = e => { zoom = Math.max(20, Math.min(300, zoom - e.deltaY * 0.08)); draw(); };

function rot(p) {
  let x = p[0] - 2.475, y = p[1] - 2.475, z = p[2] - 2.475;
  let cy = Math.cos(ry), sy = Math.sin(ry);
  let x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  let cx = Math.cos(rx), sx = Math.sin(rx);
  let y2 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
  return [x1, y2, z2];
}

function shadeColor(rgb, alpha, r) {
  const ux = r[1][0] - r[0][0], uy = r[1][1] - r[0][1], uz = r[1][2] - r[0][2];
  const vx = r[2][0] - r[0][0], vy = r[2][1] - r[0][1], vz = r[2][2] - r[0][2];
  let nx = uy * vz - uz * vy;
  let ny = uz * vx - ux * vz;
  let nz = ux * vy - uy * vx;
  const len = Math.hypot(nx, ny, nz) || 1;
  nx /= len; ny /= len; nz /= len;

  // Two-sided diffuse lighting so inward/outward winding both shade cleanly
  const dot = Math.abs(nx * L[0] + ny * L[1] + nz * L[2]);
  const shade = 0.42 + 0.68 * dot;
  const cr = Math.min(255, Math.round(rgb[0] * shade));
  const cg = Math.min(255, Math.round(rgb[1] * shade));
  const cb = Math.min(255, Math.round(rgb[2] * shade));
  return `rgba(${cr}, ${cg}, ${cb}, ${alpha})`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const polys = [];

  const pushSet = (list, baseRgb, alpha, stroke) => {
    for (const tri of list) {
      const r = tri.map(rot);
      const avgZ = (r[0][2] + r[1][2] + r[2][2]) / 3;
      const fill = shadeColor(baseRgb, alpha, r);
      polys.push({ r, avgZ, fill, stroke });
    }
  };

  if (showTets.checked) {
    const alpha = xrayTets.checked ? 0.28 : 0.96;
    const stroke = xrayTets.checked ? 'rgba(255, 193, 7, 0.25)' : 'rgba(90, 62, 0, 0.55)';
    pushSet(tets, [255, 198, 20], alpha, stroke);
  }
  if (showOcts.checked) {
    pushSet(octs, [0, 225, 255], 0.96, 'rgba(0, 65, 85, 0.55)');
  }

  polys.sort((a, b) => a.avgZ - b.avgZ);

  for (const p of polys) {
    ctx.beginPath();
    p.r.forEach((pt, idx) => {
      const sx = cx + pt[0] * zoom, sy = cy + pt[1] * zoom;
      idx === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    ctx.fillStyle = p.fill;
    ctx.fill();
    ctx.strokeStyle = p.stroke;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}
resize();
