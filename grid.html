<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Interactive Grid</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
            user-select: none; /* Prevents text selection highlighting on fast clicks */
        }

        /* Controls Panel Style */
        .controls {
            margin-bottom: 25px;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .controls label {
            font-weight: bold;
            color: #333;
        }

        .controls input[type="range"] {
            cursor: pointer;
        }

        /* Button Styling */
        button {
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-undo {
            background-color: #3b82f6; /* Blue */
        }

        .btn-undo:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .btn-undo:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-reset {
            background-color: #ef4444; /* Red */
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }

        /* Fixed Grid Footprint Container */
        #grid-container {
            width: 450px;
            height: 450px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 10px;
            box-sizing: border-box;
        }

        /* Dynamic CSS Grid configuration replaces the HTML <table> layout */
        #pixelGrid {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 2px; /* White space separation between grid cells */
            background-color: #ffffff;
        }

        .grid-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.25rem;
            color: #9ca3af; /* Default gray text color */
            transition: background-color 0.15s ease;
            box-sizing: border-box;
        }

        /* State Classes */
        .cell-gray {
            background-color: #d1d5db; /* Default Gray */
        }

        .cell-green {
            background-color: #22c55e; /* Vibrant Green */
        }

        .cell-black {
            background-color: #111827; /* Near Black */
        }
    </style>
</head>
<body>

    <!-- Controls Panel -->
    <div class="controls">
        <label for="sizeSlider">Grid Size: <span id="sizeValue">5x5</span></label>
        <input type="range" id="sizeSlider" min="3" max="10" value="5">
        <button class="btn-undo" id="undoBtn" disabled>Undo</button>
        <button class="btn-reset" id="resetBtn">Reset Grid</button>
    </div>

    <!-- Container keeping the grid a fixed total shape -->
    <div id="grid-container">
        <div id="pixelGrid"></div>
    </div>

    <script>
        const slider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const grid = document.getElementById('pixelGrid');
        const resetBtn = document.getElementById('resetBtn');
        const undoBtn = document.getElementById('undoBtn');

        // History stack to track preceding board states
        let historyStack = [];
        
        // Counter to track the placement order index of black cells
        let blackCellCount = 0;

        // Definitions for orthogonal neighbor offsets (Up, Down, Left, Right)
        const directions = [
            { r: -1, c: 0 }, // Up
            { r: 1,  c: 0 }, // Down
            { r: 0,  c: -1 }, // Left
            { r: 0,  c: 1 }  // Right
        ];

        // Initializes or redraws the grid based on size dimensions
        function createGrid(size) {
            grid.innerHTML = ''; // Clear previous grid contents
            historyStack = [];   // Clear change history tracking
            blackCellCount = 0;  // Reset index counter
            updateUndoButtonState();

            // Set dynamic grid templates to enforce equal sizing instantly
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${size}, 1fr)`;
            
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement('div');
                    
                    // Assign dataset coordinate indices for spatial mapping
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    // All cells start out as gray with no text
                    cell.className = 'grid-cell cell-gray';
                    cell.textContent = '';
                    
                    // Dynamic scaling adjustments so text fits well on larger grids
                    if (size > 7) {
                        cell.style.fontSize = '0.9rem';
                    } else if (size > 5) {
                        cell.style.fontSize = '1.1rem';
                    } else {
                        cell.style.fontSize = '1.35rem';
                    }
                    
                    // Click handler tied directly to the cell context
                    cell.addEventListener('click', () => handleCellClick(r, c, size));
                    
                    grid.appendChild(cell);
                }
            }
        }

        // Helper function to easily target specific cells via coordinate queries
        function getCell(row, col) {
            return grid.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        // Saves current state classes and text of all cells into history array
        function saveHistoryState() {
            const allCells = grid.querySelectorAll('.grid-cell');
            
            // Map both className and current textContent so indices match perfectly on undo
            const stateSnapshot = Array.from(allCells).map(cell => ({
                className: cell.className,
                text: cell.textContent
            }));
            
            // Save snapshot alongside current index counter value
            historyStack.push({
                board: stateSnapshot,
                counter: blackCellCount
            });
            updateUndoButtonState();
        }

        // Toggles interactive clickable property of the Undo button interface element
        function updateUndoButtonState() {
            undoBtn.disabled = historyStack.length === 0;
        }

        // Logic processing clicks and executing directional paths
        function handleCellClick(startRow, startCol, size) {
            const clickedCell = getCell(startRow, startCol);

            // 1. Ignore if the clicked cell itself is black or green
            if (clickedCell.classList.contains('cell-black') || clickedCell.classList.contains('cell-green')) {
                return;
            }

            // 2. Ignore if any orthogonal neighbor is black
            for (let i = 0; i < directions.length; i++) {
                const neighborRow = startRow + directions[i].r;
                const neighborCol = startCol + directions[i].c;

                // Ensure neighbor coordinates are within grid boundaries
                if (neighborRow >= 0 && neighborRow < size && neighborCol >= 0 && neighborCol < size) {
                    const neighborCell = getCell(neighborRow, neighborCol);
                    if (neighborCell && neighborCell.classList.contains('cell-black')) {
                        return; // Halt completely if a black neighbor is found
                    }
                }
            }

            // A valid execution path is confirmed, save history state snapshot first
            saveHistoryState();

            // Increment black cell tally and update text content inside the element
            blackCellCount++;
            clickedCell.className = 'grid-cell cell-black';
            clickedCell.textContent = blackCellCount;

            // Travel outward in 4 straight lines
            directions.forEach(dir => {
                let currentRow = startRow + dir.r;
                let currentCol = startCol + dir.c;

                // Move outward step-by-step along the vector until hitting structural bounds
                while (currentRow >= 0 && currentRow < size && currentCol >= 0 && currentCol < size) {
                    const cell = getCell(currentRow, currentCol);

                    // Terminate path instantly if colliding into an existing black cell
                    if (cell.classList.contains('cell-black')) {
                        break;
                    }

                    // Perform a two-state flip toggling variant between gray and green
                    if (cell.classList.contains('cell-gray')) {
                        cell.className = 'grid-cell cell-green';
                    } else if (cell.classList.contains('cell-green')) {
                        cell.className = 'grid-cell cell-gray';
                    }

                    // Advance cursor further along the direction path
                    currentRow += dir.r;
                    currentCol += dir.c;
                }
            });
        }

        // Undo Button Event Listener: Pops and overwrites elements back one step frame
        undoBtn.addEventListener('click', () => {
            if (historyStack.length === 0) return;
            
            const lastHistoryEntry = historyStack.pop();
            const previousBoard = lastHistoryEntry.board;
            
            // Revert global counter to match this point in time
            blackCellCount = lastHistoryEntry.counter;
            
            const allCells = grid.querySelectorAll('.grid-cell');
            allCells.forEach((cell, index) => {
                cell.className = previousBoard[index].className;
                cell.textContent = previousBoard[index].text;
            });
            
            updateUndoButtonState();
        });

        // Reset Button Event Listener: Toggles all active classes back to default gray
        resetBtn.addEventListener('click', () => {
            // Save state prior to wipe sequence to allow reversing the reset operation
            saveHistoryState();
            
            blackCellCount = 0;
            const allCells = grid.querySelectorAll('.grid-cell');
            allCells.forEach(cell => {
                cell.className = 'grid-cell cell-gray';
                cell.textContent = '';
            });
        });

        // Event listener to monitor slider configurations dynamically
        slider.addEventListener('input', (e) => {
            const size = parseInt(e.target.value);
            sizeValue.textContent = `${size}x${size}`;
            createGrid(size);
        });

        // Bootstrap initial run setup
        createGrid(parseInt(slider.value));
    </script>

</body>
</html>
